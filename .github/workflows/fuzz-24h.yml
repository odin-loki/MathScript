name: Fuzz 24h

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: >-
          Budget per target, in seconds. The default is the 86400 the tag
          criterion asks for; a shorter value rehearses the job itself, which is
          worth doing after any change to how it is invoked -- the 2026-09-16 run
          spent seven runner-hours proving that the corpus flag was a no-op.
        required: false
        default: "86400"
      targets:
        description: >-
          JSON array of the targets to run. The default is all seven. Narrowing it to
          one -- ["fuzz_repl_input"] -- is how a single target gets a long budget
          without spending seven runners on it, which matters because that target is
          the one still finding things.
        required: false
        default: >-
          ["fuzz_special_fns","fuzz_matrix_ops","fuzz_repl_input","fuzz_sym_parser","fuzz_poly_ops","fuzz_bignum","fuzz_mpi_message"]

jobs:
  fuzz-24h:
    name: libFuzzer 24h (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 1500
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    env:
      MS_CI_LINUX_FLAGS: >-
        -DMS_BUILD_TESTS=ON
        -DMS_ENABLE_CUDA=OFF
        -DMS_ENABLE_AVX512=OFF
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build g++-13

      - name: Configure
        run: cmake -S . -B build-fuzz-24h -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMS_BUILD_FUZZ=ON ${{ env.MS_CI_LINUX_FLAGS }}

      - name: Build fuzz target
        run: cmake --build build-fuzz-24h --target ${{ matrix.target }}

      # `scripts/fuzz_session.sh` carries the corpus handling, the chunking and
      # the artifact check, and says at length why each is the way it is. It is
      # the same script the CI smoke, both nightly sessions and the local
      # marathon runner use: this job having its own copy of those fifteen lines
      # is how three of the four came to be wrong.
      - name: Run fuzz session
        run: bash scripts/fuzz_session.sh build-fuzz-24h ${{ matrix.target }} "${{ inputs.seconds }}"

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: ignore
