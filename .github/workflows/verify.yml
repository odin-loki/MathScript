name: Formal verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cbmc:
    name: CBMC bounded model checking
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install CBMC
        run: |
          sudo apt-get update
          sudo apt-get install -y cbmc
      - name: Verify
        run: bash verification/run.sh

  esbmc:
    name: ESBMC bounded model checking
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ESBMC is not in the Ubuntu archive, so it comes from the project's own
      # release. The runner has unrestricted egress, which the development
      # container did not -- see verification/README.md.
      - name: Install ESBMC
        env:
          # `api.github.com` allows 60 unauthenticated requests an hour PER IP, and a
          # hosted runner's IP is shared with every other job on that machine -- so this
          # call gets a 403 on somebody else's traffic rather than on ours, which is
          # what happened. The workflow's own token raises the limit to 1000 an hour for
          # this repository and costs nothing: it is already present, and the call reads
          # a public release.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/esbmc/esbmc/releases/latest"
          release=""
          for attempt in 1 2 3; do
            if release="$(curl -fsSL \
                               -H "Authorization: Bearer ${GH_TOKEN}" \
                               -H "X-GitHub-Api-Version: 2022-11-28" \
                               -H "Accept: application/vnd.github+json" "${api}")"; then
              break
            fi
            release=""
            status="$(curl -s -o /dev/null -w '%{http_code}' \
                           -H "Authorization: Bearer ${GH_TOKEN}" "${api}" || true)"
            echo "attempt ${attempt}: ${api} returned HTTP ${status}" >&2
            sleep "$((attempt * 5))"
          done
          if [ -z "${release}" ]; then
            # Worth spelling out, because the bare `curl: (22)` this replaces says only
            # that something was not 2xx: a 403 here is a rate limit and not a missing
            # release, and the two want opposite responses.
            echo "could not read the ESBMC release list; the HTTP status is above." >&2
            echo "403 there means rate limiting, not a missing or renamed release." >&2
            exit 1
          fi
          # Select on the exact x86_64 asset. Matching "linux" alone also matches
          # esbmc-linux-armv8.zip, which downloads happily and then dies with
          # "Exec format error" on an x86_64 runner.
          url="$(printf '%s' "${release}" \
                 | jq -r '.assets[] | select(.name | test("^esbmc-linux\\.(zip|tar\\.gz)$")) | .browser_download_url' \
                 | head -1)"
          if [ -z "${url}" ] || [ "${url}" = "null" ]; then
            echo "no linux asset on the latest ESBMC release" >&2
            exit 1
          fi
          echo "fetching ${url}"
          mkdir -p "${HOME}/esbmc"
          case "${url}" in
            *.tar.gz|*.tgz) curl -fsSL "${url}" | tar xz -C "${HOME}/esbmc" ;;
            *.zip)          curl -fsSL "${url}" -o /tmp/esbmc.zip && unzip -q /tmp/esbmc.zip -d "${HOME}/esbmc" ;;
            *)              curl -fsSL "${url}" -o "${HOME}/esbmc/esbmc" && chmod +x "${HOME}/esbmc/esbmc" ;;
          esac
          bin="$(find "${HOME}/esbmc" -type f -name esbmc -perm -u+x | head -1)"
          if [ -z "${bin}" ]; then
            echo "esbmc binary not found in the downloaded asset" >&2
            find "${HOME}/esbmc" -maxdepth 3 -type f | head -20 >&2
            exit 1
          fi
          echo "$(dirname "${bin}")" >> "${GITHUB_PATH}"

      - name: Version
        run: esbmc --version

      - name: Verify
        run: bash verification/run.sh
